# ────────────────────────────────────────────────────────────
#  HireLens — CI Pipeline
#
#  Triggers: pull requests + pushes to main
#  Jobs:     Lint → Build → Docker build (per service)
# ────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Backend CI
  # ═══════════════════════════════════════════════════════════
  backend:
    name: Backend — Install, Build & Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint/test scripts exist in backend yet — add steps here
      # when you add them to package.json:
      # - name: Lint
      #   run: npm run lint
      # - name: Test
      #   run: npm test

      - name: Build Docker image
        run: docker build -t hirelens-backend:ci .

  # ═══════════════════════════════════════════════════════════
  #  Frontend CI
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: Frontend — Lint, Build & Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=placeholder \
            --build-arg VITE_API_URL=http://placeholder \
            --build-arg VITE_STREAM_API_KEY=placeholder \
            -t hirelens-frontend:ci .
