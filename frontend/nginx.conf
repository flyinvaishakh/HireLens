# ────────────────────────────────────────────────────────────
#  HireLens Frontend — Nginx Configuration
#  Serves the Vite/React SPA with client-side routing support.
# ────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static asset caching ────────────────────────────────
    # Vite hashes filenames, so aggressive caching is safe.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback (React Router v7) ──────────────────────
    # Any route that doesn't match a static file falls back to
    # index.html so client-side routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
